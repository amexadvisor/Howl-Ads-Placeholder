<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Howl Ads Mini App</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.75);
            --accent-primary: #6366f1;
            --accent-gradient: linear-gradient(135deg, #6366f1, #a855f7);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --success-color: #22c55e;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 380px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .header h2 {
            margin: 0 0 6px 0;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .header p {
            margin: 0;
            color: var(--text-sub);
            font-size: 0.85rem;
        }

        .progress-card {
            margin-top: 20px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 20px;
            padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .progress-track {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-gradient);
            border-radius: 6px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 16px rgba(99, 102, 241, 0.6);
        }

        .status-badge {
            margin-top: 16px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .action-button {
            margin-top: 20px;
            width: 100%;
            background: var(--accent-gradient);
            color: #fff;
            border: none;
            border-radius: 16px;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .action-button:active {
            transform: scale(0.97);
        }

        .action-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>🚀 Howl Ads Hub</h2>
            <p>Watch ads to progress & earn rewards</p>
        </div>

        <div class="progress-card">
            <div class="progress-info">
                <span>🎯 Ads Played</span>
                <span id="progressText">0 / 5</span>
            </div>
            
            <div class="progress-track">
                <div id="progressFill" class="progress-fill"></div>
            </div>
        </div>

        <div class="status-badge" id="statusBadge">
            ⚡ Ready to Watch
        </div>

        <button class="action-button" id="watchAdBtn" onclick="simulateAdWatch()">
            📺 Watch Next Ad
        </button>
    </div>

    <script>
        // Initialize Telegram Web App Context
        const tg = window.Telegram.WebApp;
        tg.expand();

        // State variables
        let currentAdsPlayed = 0;
        const totalAdsRequired = 5;

        // Function to update progress graphics & dynamic count
        function updateAdProgress(newCount) {
            currentAdsPlayed = Math.min(newCount, totalAdsRequired);
            
            // Calculate precise bar width percentage
            const percentage = (currentAdsPlayed / totalAdsRequired) * 100;
            
            // Apply fluid animation to progress fill bar
            document.getElementById('progressFill').style.width = percentage + '%';
            
            // Display exact counter text instead of locking to 1
            document.getElementById('progressText').innerText = `${currentAdsPlayed} / ${totalAdsRequired}`;
            
            const badge = document.getElementById('statusBadge');
            const btn = document.getElementById('watchAdBtn');

            if (currentAdsPlayed >= totalAdsRequired) {
                badge.innerHTML = '🎉 Goal Completed!';
                badge.style.background = 'rgba(34, 197, 94, 0.15)';
                badge.style.color = '#4ade80';
                btn.innerText = '✨ Claim Reward';
                btn.style.background = 'linear-gradient(135deg, #22c55e, #16a34a)';
            } else {
                badge.innerHTML = `🔥 Ad ${currentAdsPlayed} Watched Successfully`;
            }
        }

        // Simulation function (Connect your Monetag / Adsgram SDK callbacks here)
        function simulateAdWatch() {
            const btn = document.getElementById('watchAdBtn');
            if (currentAdsPlayed >= totalAdsRequired) {
                tg.showAlert('🎉 Congratulations! Your reward has been successfully issued.');
                tg.close();
                return;
            }

            btn.disabled = true;
            btn.innerText = '⏳ Loading Ad...';

            // Simulating ad viewing interval (Replace with actual Monetag/Adsgram SDK trigger)
            setTimeout(() => {
                // Increment cleanly on success callback
                updateAdProgress(currentAdsPlayed + 1);
                
                if (currentAdsPlayed < totalAdsRequired) {
                    btn.disabled = false;
                    btn.innerText = '📺 Watch Next Ad';
                }
            }, 1200);
        }
    </script>
</body>
</html>
