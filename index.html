<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Howl Ads Mini App</title>
    
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Monetag TMA Zone Script -->
    <script src="https://alwingulla.com/88/tag.min.js" data-zone="11448261" async data-cfasync="false"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 40px auto;
            padding: 20px;
            border-radius: 12px;
            background: var(--tg-theme-secondary-bg-color, #f4f4f5);
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🐺 Howl Ads</h2>
        <p>Tap below to test your ad zone.</p>
        <button id="adButton">Watch Ad & Earn</button>
        <p id="status" style="margin-top: 15px; font-size: 14px;"></p>
    </div>

    <script>
        // Initialize Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand();

        document.getElementById('adButton').addEventListener('click', () => {
            const statusEl = document.getElementById('status');
            statusEl.innerText = "Loading ad...";

            // Dynamically call your specific Zone ID function created by the SDK
            const showMethod = window['show_11448261'];

            if (typeof showMethod === "function") {
                showMethod().then(() => {
                    statusEl.innerText = "Reward granted successfully!";
                }).catch((error) => {
                    console.error("Ad error:", error);
                    statusEl.innerText = "Ad unavailable or skipped.";
                });
            } else {
                statusEl.innerText = "Ad system is still initializing. Try again.";
            }
        });
    </script>
</body>
</html>
