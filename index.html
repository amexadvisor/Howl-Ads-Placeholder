<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Howl Ads Mini App</title>
    
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Monetag TMA Zone Script -->
    <script src="https://alwingulla.com/88/tag.min.js" data-zone="11448261" async data-cfasync="false"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 40px auto;
            padding: 20px;
            border-radius: 12px;
            background: var(--tg-theme-secondary-bg-color, #f4f4f5);
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🐺 Howl Ads</h2>
        <p>Tap below to test your ad zone.</p>
        <button id="adButton">Watch Ad & Earn</button>
        <p id="status" style="margin-top: 15px; font-size: 14px;"></p>
    </div>

        <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const statusEl = document.getElementById('status');
        const adButton = document.getElementById('adButton');
        
        // Disable button until ad system is ready
        adButton.disabled = true;
        statusEl.innerText = "Initializing ad network...";

        // Check every second if Monetag's function has loaded
        const checkInterval = setInterval(() => {
            if (typeof window['show_11448261'] === "function") {
                clearInterval(checkInterval);
                statusEl.innerText = "Ad system ready!";
                adButton.disabled = false;
            }
        }, 1000);

        adButton.addEventListener('click', () => {
            statusEl.innerText = "Loading ad...";

            const showMethod = window['show_11448261'];

            if (typeof showMethod === "function") {
                showMethod().then(() => {
                    statusEl.innerText = "Reward granted successfully!";
                }).catch((error) => {
                    console.error("Ad error:", error);
                    statusEl.innerText = "Ad unavailable or closed.";
                });
            } else {
                statusEl.innerText = "Ad system is still initializing. Check your ad blocker!";
            }
        });
    </script>

</body>
</html>
